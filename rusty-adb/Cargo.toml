[package]
name = "rusty-adb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "rusty-adb"
path = "src/main.rs"

[dependencies]
rusty-logging = { path = "../rusty-logging" }

# UI framework
iced = { version = "0.13", features = ["tokio", "image"] }

# Async runtime
tokio = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Serialization (config file)
serde = { workspace = true }
serde_yaml = "0.9"

# Filesystem helpers
dirs = "5"

[dev-dependencies]
tempfile = "3"
