[workspace]
resolver = "2"
members = [
    "rusty-adb",
    "rusty-logging",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Aaron"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
